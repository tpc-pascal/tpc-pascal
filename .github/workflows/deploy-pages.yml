name: Pages — Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned repos for the navbar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query{user(login:"tpc-pascal"){pinnedItems(first:6,types:REPOSITORY){nodes{... on Repository{name url}}}}}' \
            --jq '[.data.user.pinnedItems.nodes[] | select(.name)]' > website/pinned.json
          cat website/pinned.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run sync
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
