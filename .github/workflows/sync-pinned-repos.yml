'name': Sync Pinned Repos
'on':
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  sync-pinned-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PASCAL_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PASCAL_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Sync README Projects table with pinned repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_pinned_projects.py
      - name: Commit pinned table (if changed)
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "pascal-automation-agent[bot]"
            git config user.email "348848148+pascal-automation-agent[bot]@users.noreply.github.com"
            git config committer.name "pascal-automation-agent[bot]"
            git config committer.email "348848148+pascal-automation-agent[bot]@users.noreply.github.com"
            git add README.md
            commit_body="$(printf '%s\n' \
              'Work done' \
              '- Refresh the generated Projects table from current GitHub pinned repositories.' \
              '' \
              'Effect' \
              '- Keep the profile repository listing aligned with the pinned repositories.' \
              '' \
              'Benefits' \
              '- Keep featured projects current without manual table edits.' \
              '' \
              'Files changed' \
              '- README.md')"
            git commit -m "chore(profile): sync pinned project listing" -m "$commit_body"
            git push
          fi
