name: Waka — Update Stats
'on':
  workflow_dispatch: null
  schedule:
  - cron: 0 0 * * *
jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - uses: athul/waka-readme@master
      with:
        WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        SHOW_TITLE: true
        SECTION_NAME: waka
        TIME_RANGE: last_7_days
        LANG_COUNT: 5
        SHOW_TIME: true
        SHOW_TOTAL: false
        STOP_AT_OTHER: true
    - name: Redeploy Pages homepage
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY"
